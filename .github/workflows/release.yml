name: Release native plugin

on:
  push:
    branches: ['master']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.11'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release version
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'VERSION must contain a dotted numeric release version' >&2
            exit 1
          fi
          tag="v$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$tag" == "$GITHUB_REF_NAME" ]] || { echo 'Tag must match VERSION' >&2; exit 1; }
          elif [[ "$GITHUB_REF_NAME" != master ]]; then
            echo 'Run this workflow on master or a matching release tag' >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1)"; then
            if [[ "$state" == false ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              echo "Release $tag is already published. Increment VERSION to publish again."
              exit 0
            fi
            echo "A draft already exists for $tag. Review it before trying again." >&2
            exit 1
          elif [[ "$state" != *'release not found'* && "$state" != *'HTTP 404'* ]]; then
            echo "$state" >&2
            exit 1
          fi
          refs="$(git ls-remote --tags origin "refs/tags/$tag^{}" "refs/tags/$tag")"
          target="$(awk 'NR == 1 { first = $1 } /\^\{\}$/ { peeled = $1 } END { print (peeled ? peeled : first) }' <<< "$refs")"
          if [[ -n "$target" && "$target" != "$commit" ]]; then
            echo "Tag $tag points to a different commit" >&2
            exit 1
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    uses: ./.github/workflows/ci.yml

  build:
    needs: [plan, verify]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-latest, manylinux: "x86_64@sha256:8a79ff36ce155d8f242dc8013d73c5e8bbe937defb15de7d7afb342c1ab537f4" }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, manylinux: "aarch64@sha256:382236bfd11d86894d9792a6fa5286190b8dd3d075a7032284e123c288711e4f" }
          - { target: darwin-amd64, runner: macos-15-intel }
          - { target: darwin-arm64, runner: macos-15 }
          - { target: windows-amd64, runner: windows-latest }
          - { target: windows-arm64, runner: windows-11-arm }
          - { target: freebsd-amd64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set release version
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: echo "MFG_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build Linux glibc plugin
        if: matrix.manylinux
        shell: bash
        env:
          MANYLINUX_ARCH: ${{ matrix.manylinux }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/src" -v "$(go env GOROOT):/opt/host-go:ro" \
            -w /src -e MFG_VERSION "quay.io/pypa/manylinux2014_$MANYLINUX_ARCH" \
            bash -euo pipefail -c '
              export PATH="/opt/host-go/bin:/opt/python/cp312-cp312/bin:$PATH"
              export GOPATH=/tmp/mfg-go GOCACHE=/tmp/mfg-cache GOTOOLCHAIN=local
              artifact="$(./scripts/build.sh)"
              newest="$(readelf --version-info "$artifact" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu | tail -n 1)"
              test "$(printf "2.17\n%s\n" "$newest" | sort -V | tail -n 1)" = "2.17"
            '
      - name: Build macOS and Windows plugins
        if: startsWith(matrix.target, 'darwin-') || startsWith(matrix.target, 'windows-')
        shell: bash
        run: ./scripts/build.sh
      - name: Build FreeBSD plugin
        if: matrix.target == 'freebsd-amd64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          sysroot="$(mktemp -d)"
          curl -fsSL --retry 3 https://download.freebsd.org/releases/amd64/14.4-RELEASE/base.txz -o "$sysroot/base.txz"
          sudo tar -xf "$sysroot/base.txz" -C "$sysroot" ./usr/include ./usr/lib ./lib
          GOOS=freebsd GOARCH=amd64 CC="clang --target=x86_64-unknown-freebsd14 --sysroot=$sysroot" \
            CGO_LDFLAGS=-fuse-ld=lld ./scripts/build.sh
      - name: Package Store ZIP
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            darwin-*) extension=dylib ;;
            windows-*) extension=dll ;;
            *) extension=so ;;
          esac
          python3 scripts/package-release.py zip --version "$MFG_VERSION" --target "$TARGET" \
            --library "dist/$TARGET/model-fingerprint-guard-v$MFG_VERSION.$extension" --out dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/release/*.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [plan, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify asset set and generate checksums
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python3 scripts/package-release.py checksums --version "$VERSION" --out release
      - name: Verify archives with the CLIProxyAPI installer
        env:
          MFG_RELEASE_DIR: ${{ github.workspace }}/release
          MFG_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: go test -v ./tests/store
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "$tag" --generate-notes --latest release/*.zip release/checksums.txt
