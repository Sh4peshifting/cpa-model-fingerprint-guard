name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned upstreams
        run: |
          git init -q /tmp/lm-detector
          git -C /tmp/lm-detector fetch -q --depth 1 https://github.com/Ikaleio/lm-detector.git e0472890bea827d15ca883636a77d4c10bbe843b
          git -C /tmp/lm-detector checkout -q --detach FETCH_HEAD
          git clone --depth 1 --branch v8.1.2 https://github.com/router-for-me/CLIProxyAPI.git /tmp/cliproxyapi
          test "$(git -C /tmp/cliproxyapi rev-parse HEAD)" = 85225381d89915595598ed13766cd79890c03a84
      - name: Verify source
        env:
          MFG_TEST_REFERENCE: /tmp/lm-detector/data
        run: |
          test -z "$(gofmt -l cmd internal tests)"
          go test ./...
          go vet ./...
          go test -race ./...
          node --check cmd/model-fingerprint-guard/web/app.js
          node --check tests/browser.mjs
          git diff --check
      - name: Build and exercise plugin in CLIProxyAPI
        env:
          MFG_REFERENCE_REPO: /tmp/lm-detector
          MFG_CHROMIUM: google-chrome
        run: |
          (cd /tmp/cliproxyapi && CGO_ENABLED=1 go build -o /tmp/cli-proxy-api ./cmd/server)
          artifact="$(./scripts/build.sh)"
          python3 tests/host_integration.py --host /tmp/cli-proxy-api --plugin "$artifact" --browser-test
